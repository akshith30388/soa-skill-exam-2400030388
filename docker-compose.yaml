name: microservices-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: exam123
      POSTGRES_DB: soa-skill-exam-2400030388
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soa-skill-exam-2400030388"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-network

  fuelstation-service:
    image: akshith03/docker-skill-exam-2400030388:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuelstation-service
    ports:
      - "388:8001"
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
